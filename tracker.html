<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security+ Practice Exam Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #e9e9e9;
    }
    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h1>Security+ Practice Exam Tracker</h1>

  <form id="trackerForm">
    <table>
      <tr>
        <th>Attempt</th>
        <th>Date Taken</th>
        <th>Score (%)</th>
        <th>Time Taken</th>
        <th>Weak Areas</th>
        <th>Notes</th>
      </tr>
      <tr>
        <td><input type="number" name="attempt" required></td>
        <td><input type="date" name="date" required></td>
        <td><input type="number" name="score" min="0" max="100" required></td>
        <td><input type="text" name="time" placeholder="e.g., 90 mins"></td>
        <td><input type="text" name="weak" placeholder="e.g., Cryptography"></td>
        <td><input type="text" name="notes" placeholder="e.g., Guessed PKI"></td>
      </tr>
    </table>
    <button type="submit">Save Entry</button>
  </form>

  <h2>Progress Log</h2>
  <table id="logTable">
    <tr>
      <th>Attempt</th>
      <th>Date Taken</th>
      <th>Score (%)</th>
      <th>Time Taken</th>
      <th>Weak Areas</th>
      <th>Notes</th>
    </tr>
  </table>

  <script>
    const form = document.getElementById('trackerForm');
    const logTable = document.getElementById('logTable');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const data = new FormData(form);
      const row = logTable.insertRow();

      for (let value of data.values()) {
        const cell = row.insertCell();
        cell.textContent = value;
      }

      form.reset();
    });
  </script>
</body>
</html>
