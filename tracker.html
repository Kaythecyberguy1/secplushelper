<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security+ Practice Exam Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    input, textarea, button, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .entry {
      background: #fff;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #ccc;
    }
    .timer {
      font-size: 24px;
      font-weight: bold;
      color: #d9534f;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Security+ Practice Exam Tracker</h1>

  <div class="timer" id="timer">90:00</div>
  <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
    <button onclick="startTimer()">Start Exam Mode</button>
    <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

  <label>Topic:</label>
  <input type="text" id="topic" placeholder="E.g. Threats and Vulnerabilities" />

  <label>Score (%):</label>
  <input type="number" id="score" placeholder="E.g. 85" />

  <label>Time Taken:</label>
  <input type="text" id="time" placeholder="E.g. 1h 15m" />

  <label>Notes:</label>
  <textarea id="notes" rows="4" placeholder="What did you learn or struggle with?"></textarea>

  <button onclick="saveProgress()">Save Progress</button>

  <div id="entries"></div>

  <script>
    let timerInterval;
    let totalTime = 90 * 60; // 90 minutes in seconds
    let currentTime = totalTime;

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
      document.getElementById("timer").textContent = formatTime(currentTime);
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (currentTime > 0) {
          currentTime--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          alert("Time's up!");
          document.getElementById("time").value = "1h 30m";
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      const elapsed = totalTime - currentTime;
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      document.getElementById("time").value = `${mins}m ${secs}s`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      currentTime = totalTime;
      updateTimerDisplay();
      document.getElementById("time").value = "";
    }

    function saveProgress() {
      const topic = document.getElementById("topic").value;
      const score = document.getElementById("score").value;
      const time = document.getElementById("time").value;
      const notes = document.getElementById("notes").value;

      const entry = { topic, score, time, notes };

      let entries = JSON.parse(localStorage.getItem("examProgress")) || [];
      entries.push(entry);
      localStorage.setItem("examProgress", JSON.stringify(entries));
      renderEntries();

      document.getElementById("topic").value = "";
      document.getElementById("score").value = "";
      document.getElementById("time").value = "";
      document.getElementById("notes").value = "";
    }

    function renderEntries() {
      const entriesDiv = document.getElementById("entries");
      entriesDiv.innerHTML = "";
      const entries = JSON.parse(localStorage.getItem("examProgress")) || [];

      entries.forEach((entry, index) => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <strong>Topic:</strong> ${entry.topic}<br/>
          <strong>Score:</strong> ${entry.score}%<br/>
          <strong>Time:</strong> ${entry.time}<br/>
          <strong>Notes:</strong> ${entry.notes}<br/>
        `;
        entriesDiv.appendChild(div);
      });
    }

    updateTimerDisplay();
    renderEntries();
  </script>
</body>
</html>
