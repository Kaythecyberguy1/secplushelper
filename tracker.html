<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security+ Practice Exam Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #0066cc;
      color: white;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    #timer {
      font-size: 1.5em;
      text-align: center;
      margin: 20px 0;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Security+ Exam Practice Tracker</h1>

    <label for="examName">Select Practice Exam</label>
    <select id="examName">
      <option value="Practice Exam A">Practice Exam A</option>
      <option value="Practice Exam B">Practice Exam B</option>
      <option value="Practice Exam C">Practice Exam C</option>
    </select>

    <label for="attempt">Attempt Number</label>
    <input type="number" id="attempt" min="1" required />

    <label for="date">Date</label>
    <input type="date" id="date" required />

    <label for="score">Score</label>
    <input type="number" id="score" min="0" max="100" required />

    <label for="notes">Notes</label>
    <textarea id="notes"></textarea>

    <button onclick="startTimer()">Start 90-Minute Exam Mode</button>
    <div id="timer">01:30:00</div>

    <button onclick="saveAttempt()">Save Attempt</button>

    <h2>Saved Attempts</h2>
    <table id="resultsTable">
      <thead>
        <tr>
          <th>Exam</th>
          <th>Attempt</th>
          <th>Date</th>
          <th>Score</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let timerInterval;
    function startTimer() {
      clearInterval(timerInterval);
      let time = 90 * 60;
      const display = document.getElementById("timer");

      function updateDisplay() {
        const minutes = String(Math.floor(time / 60)).padStart(2, '0');
        const seconds = String(time % 60).padStart(2, '0');
        display.textContent = `${minutes}:${seconds}`;
      }

      updateDisplay();
      timerInterval = setInterval(() => {
        time--;
        updateDisplay();
        if (time <= 0) clearInterval(timerInterval);
      }, 1000);
    }

    function saveAttempt() {
      const exam = document.getElementById("examName").value;
      const attempt = document.getElementById("attempt").value;
      const date = document.getElementById("date").value;
      const score = document.getElementById("score").value;
      const notes = document.getElementById("notes").value;

      const data = { exam, attempt, date, score, notes };
      const existing = JSON.parse(localStorage.getItem("examAttempts") || "[]");
      existing.push(data);
      localStorage.setItem("examAttempts", JSON.stringify(existing));
      renderTable();
    }

    function renderTable() {
      const table = document.querySelector("#resultsTable tbody");
      table.innerHTML = "";
      const attempts = JSON.parse(localStorage.getItem("examAttempts") || "[]");
      for (const item of attempts) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.exam}</td>
          <td>${item.attempt}</td>
          <td>${item.date}</td>
          <td>${item.score}</td>
          <td>${item.notes}</td>
        `;
        table.appendChild(row);
      }
    }

    renderTable();
  </script>
</body>
</html>
